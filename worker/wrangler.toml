name = "thehaoftravelo-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

# Create with: npx wrangler kv namespace create FEEDBACK
# Then replace both ids. Local `wrangler dev --local` uses a simulated KV and
# does not need the real namespace to exist.
[[kv_namespaces]]
binding = "FEEDBACK"
id = "00000000000000000000000000000000"
preview_id = "00000000000000000000000000000000"

[vars]
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,https://thehaoftravelo.pages.dev"

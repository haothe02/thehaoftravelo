# Deploys the site and the API when main moves.
#
# Add these repository secrets before the first run (Settings → Secrets and
# variables → Actions). The workflow cannot deploy without them:
#   CLOUDFLARE_API_TOKEN   API token with Workers and Pages edit
#   CLOUDFLARE_ACCOUNT_ID  791478083127616c52330b777a7c6e36
# Optional, turns on Cloudflare Web Analytics at build time:
#   VITE_CF_BEACON_TOKEN
name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Deploy Worker thehaoftravelo-api
        run: npm run deploy -w @thehaoftravelo/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build the site
        run: npm run build
        env:
          VITE_API_BASE: https://thehaoftravelo-api.thehaoftravelo.workers.dev
          VITE_CF_BEACON_TOKEN: ${{ secrets.VITE_CF_BEACON_TOKEN }}

      - name: Deploy Pages project thehaoftravelo
        run: npx wrangler pages deploy web/dist --project-name thehaoftravelo --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
